---
# Default variables for jit_ca_target role
# Override in host_vars, group_vars, or playbook vars.

# Dedicated service account on the target host used by the agent with JIT certs
jit_ca_principal_user: "agent"
jit_ca_principal_uid: null
jit_ca_principal_shell: "/bin/bash"
jit_ca_principal_groups:
  - "sudo"
jit_ca_sudo_nopasswd: true

# Required: contents of step-ca's certs/ssh_user_ca_key.pub (single line)
jit_ca_user_ca_pubkey: ""

# Target hostname used in the per-target principal (<jit_ca_principal_user>@<jit_ca_target_name>).
# Must match the target entry in jit-ca-approver's TARGET_ALLOWLIST.
jit_ca_target_name: "{{ inventory_hostname }}"

# OpenSSH CA trust & AuthorizedPrincipals paths
jit_ca_trusted_ca_keys_path: "/etc/ssh/trusted_user_ca_keys"
jit_ca_principals_dir: "/etc/ssh/jit_ca_principals"
jit_ca_sshd_dropin_path: "/etc/ssh/sshd_config.d/10-jit-ca.conf"

# Optional human-held break-glass SSH public key (Section 10 of REPLICATION-GUIDE.md).
# When non-empty and jit_ca_manage_authorized_keys is true, writes ~/.ssh/authorized_keys
# containing only jit_ca_break_glass_pubkey (+ any jit_ca_extra_authorized_keys),
# retiring any build-time static agent keys.
jit_ca_manage_authorized_keys: false
jit_ca_break_glass_pubkey: ""
jit_ca_extra_authorized_keys: []

# Optional Proxmox hypervisor self-reference guard hookscript installation
# (Disabled by default; enable only on Proxmox hypervisors that host the jit-ca VM).
jit_ca_hypervisor_guard_enabled: false
jit_ca_proxmox_snippets_dir: "/var/lib/vz/snippets"

# Optional birth public key to scrub from /root/.ssh/authorized_keys at the end
# of Day-0 enrollment (in case root was used as the bootstrap SSH user).
jit_ca_purge_birth_pubkey: ""
